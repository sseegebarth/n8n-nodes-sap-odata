name: Release

# Publishes to npm via trusted publishing (OIDC) with provenance when a version
# tag is pushed. Prerelease versions (containing "-") go to the "beta" dist-tag,
# stable versions to "latest". The tag must equal "v" + package.json version.

on:
  push:
    tags:
      - 'v*'

env:
  SCANNER_VERSION: 0.38.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm with trusted publishing support
        run: |
          npm install -g npm@11.19.1
          node -v && npm -v

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json and resolve dist-tag
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi
          case "$VERSION" in
            *-*) TAG=beta; PRE=true ;;
            *)   TAG=latest; PRE=false ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Install n8n scanner in an isolated directory
        run: npm install --prefix "$RUNNER_TEMP/scan" --ignore-scripts --no-audit --no-fund "@n8n/scan-community-package@${SCANNER_VERSION}"

      - name: Source scan (scanner source leg)
        run: node scripts/scan-gate.mjs source . "$RUNNER_TEMP/scan"

      - name: Pack
        id: pack
        run: |
          TARBALL=$(npm pack --ignore-scripts --silent)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/pkg"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/pkg"

      - name: Tarball scan (scanner dist leg)
        run: node scripts/scan-gate.mjs dist "$RUNNER_TEMP/pkg/package" "$RUNNER_TEMP/scan"

      - name: Compare 1.0.0 tarball against published beta.7
        if: steps.meta.outputs.version == '1.0.0'
        env:
          CANDIDATE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          BASELINE_DIR=$(mktemp -d "$RUNNER_TEMP/beta7.XXXXXX")
          npm pack n8n-nodes-sap-odata@0.5.0-beta.7 --registry=https://registry.npmjs.org --ignore-scripts --silent --pack-destination "$BASELINE_DIR"
          BASELINE_TARBALL="$BASELINE_DIR/n8n-nodes-sap-odata-0.5.0-beta.7.tgz"
          ACTUAL_SHA1=$(node -e 'const fs = require("node:fs"); const crypto = require("node:crypto"); console.log(crypto.createHash("sha1").update(fs.readFileSync(process.argv[1])).digest("hex"));' "$BASELINE_TARBALL")
          if [ "$ACTUAL_SHA1" != "bb0cfcb0e5b3974b23956e2b3cc4ec2e7c1e422c" ]; then
            echo "Published beta.7 tarball checksum mismatch: $ACTUAL_SHA1"
            exit 1
          fi
          node scripts/compare-tarball.mjs "$CANDIDATE_TARBALL" "$BASELINE_TARBALL"

      - name: Publish the scanned tarball
        run: npm publish "${{ steps.pack.outputs.tarball }}" --ignore-scripts --provenance --access public --tag "${{ steps.meta.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: .github/release-notes/${{ steps.meta.outputs.version }}.md
          files: ${{ steps.pack.outputs.tarball }}
